[project]
name = "llm-agent-v4"
version = "0.4.1"
description = "ICS-inspired production autonomous multi-LLM coding agent with mechanical gates, incident journals and executable verification"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0,<7.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "pydantic>=2.6,<3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<10.0",
    "mypy>=1.9,<3.0",
    "ruff>=0.4,<1.0",
]

[project.scripts]
llm-agent = "main:main"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.pytest.ini_options]
markers = ["subprocess: real nested subprocess/pytest integration tests"]
testpaths = ["tests"]
addopts = "-ra -m 'not subprocess'"
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["core*", "providers*", "config*", "templates*"]
exclude = ["tests*", "memory*", "logs*"]

[tool.setuptools.package-data]
config = ["*.yaml"]
templates = ["*.md"]
